services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alice
      POSTGRES_PASSWORD: alice
      POSTGRES_DB: alice
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  api:
    build: ../services/api
    environment:
      DATABASE_URL: postgresql+psycopg://alice:alice@postgres:5432/alice
      REDIS_URL: redis://redis:6379/0
      MARKET_DATA_PROVIDER: demo
      LIVE_TRADING: 'false'
    ports: ['8000:8000']
    depends_on: [postgres,redis]
volumes:
  pgdata:
